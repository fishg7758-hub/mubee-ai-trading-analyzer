<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUBEE AI Trading Analyzer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080c12;
  color:white;
}

.header{
  text-align:center;
  padding:22px 15px;
  background:#111821;
  border-bottom:1px solid #293441;
}

h1{
  margin:0;
  color:#f5c542;
  font-size:28px;
}

.subtitle{
  margin-top:7px;
  color:#9da8b5;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.card{
  background:#111821;
  border:1px solid #293441;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:10px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #354252;
  background:#080c12;
  color:white;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#f5c542;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#status{
  text-align:center;
  margin-top:14px;
  color:#aeb8c4;
}

#result{
  white-space:pre-wrap;
  line-height:1.7;
  color:#e9edf2;
  overflow-wrap:anywhere;
}

.result-title{
  color:#f5c542;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.footer{
  text-align:center;
  color:#687583;
  padding:25px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🟡 MUBEE AI</h1>
  <div class="subtitle">Gold Trading Analyzer</div>
</div>

<div class="container">

  <div class="card">

    <label>Chart Image</label>
    <input type="file" id="chart" accept="image/*">

    <label>Asset</label>
    <input type="text" id="asset" value="XAUUSD">

    <label>Timeframe</label>
    <select id="timeframe">
      <option value="1M">1M</option>
      <option value="5M">5M</option>
      <option value="15M" selected>15M</option>
      <option value="1H">1H</option>
      <option value="4H">4H</option>
      <option value="1D">1D</option>
    </select>

    <label>Risk ($)</label>
    <input type="number" id="risk" value="2" min="0">

    <label>Minimum Target (pips)</label>
    <input type="number" id="minPips" value="10" min="1">

    <label>Question</label>
    <textarea
      id="question"
      placeholder="Example: XAUUSD buy hai ya sell? Entry, SL aur TP batao."
    ></textarea>

    <button id="analyzeBtn" onclick="analyzeChart()">
      🔍 ANALYZE CHART
    </button>

    <div id="status"></div>

  </div>

  <div class="card">

    <div class="result-title">
      📊 MUBEE AI Analysis
    </div>

    <div id="result">
      Chart upload karke ANALYZE CHART press karein.
    </div>

  </div>

</div>

<div class="footer">
  MUBEE AI Trading Analyzer
</div>

<script>

async function analyzeChart(){

  const chart = document.getElementById("chart");
  const asset = document.getElementById("asset").value;
  const timeframe = document.getElementById("timeframe").value;
  const risk = document.getElementById("risk").value;
  const minPips = document.getElementById("minPips").value;
  const question = document.getElementById("question").value;

  const button = document.getElementById("analyzeBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!chart.files.length){
    alert("Pehle chart image upload karein.");
    return;
  }

  button.disabled = true;

  status.innerText =
    "⏳ MUBEE AI chart analyze kar raha hai...";

  result.innerText = "";

  try{

    const formData = new FormData();

    formData.append(
      "chart",
      chart.files[0]
    );

    formData.append(
      "asset",
      asset
    );

    formData.append(
      "timeframe",
      timeframe
    );

    formData.append(
      "risk",
      risk
    );

    formData.append(
      "minPips",
      minPips
    );

    formData.append(
      "question",
      question ||
      "XAUUSD ka complete technical analysis karo. BUY, SELL ya WAIT batao. Entry, Stop Loss, Take Profit aur important support/resistance batao."
    );

    const response = await fetch(
      "/api/analyze",
      {
        method:"POST",
        body:formData
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "Analysis failed"
      );
    }

    result.innerText =
      JSON.stringify(data,null,2);

    status.innerText =
      "✅ Analysis complete";

  }catch(error){

    console.error(error);

    status.innerText =
      "❌ Error";

    result.innerText =
      "Analysis nahi ho saki.\n\n" +
      error.message;

  }finally{

    button.disabled = false;

  }

}

</script>

</body>
        </html>
